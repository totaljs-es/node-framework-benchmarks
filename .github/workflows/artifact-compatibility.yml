name: Artifact compatibility
on:
  push:
    branches: [codex/validate-artifact-upgrades]
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        workload: [hello, catalog]
    steps:
      - run: mkdir -p results && printf '%s\n' '${{ matrix.workload }}' > results/payload.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-${{ github.run_attempt }}-${{ matrix.workload }}
          path: results/
          retention-days: 1
  download:
    needs: upload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: benchmark-${{ github.run_attempt }}-*
          path: incoming
      - run: |
          diff -u <(printf 'hello\n') incoming/benchmark-${{ github.run_attempt }}-hello/payload.txt
          diff -u <(printf 'catalog\n') incoming/benchmark-${{ github.run_attempt }}-catalog/payload.txt
